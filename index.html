<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(135deg,#ff4e8b,#ff8fb1,#ffc3d8);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.container{
position:relative;
z-index:10;
padding:20px;
width:100%;
max-width:700px;
}

h1{
font-size:60px;
font-weight:800;
animation:pulse 1.5s infinite;
text-shadow:0 0 15px rgba(255,255,255,.8);
}

@media(max-width:700px){
h1{
font-size:40px;
}
}

.message{
margin-top:30px;
font-size:26px;
font-weight:600;
min-height:90px;
animation:fade 2s infinite;
padding:0 15px;
}

@media(max-width:700px){
.message{
font-size:20px;
}
}

button{
margin-top:30px;
padding:14px 35px;
border:none;
border-radius:50px;
font-size:18px;
background:white;
color:#ff2d75;
cursor:pointer;
font-weight:bold;
transition:.3s;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

button:hover{
transform:scale(1.1);
}

.heart{
position:absolute;
bottom:-50px;
font-size:20px;
animation:float linear forwards;
opacity:.8;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(0) scale(0.5);
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.8);
opacity:0;
}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.08);
}
}

@keyframes fade{
0%,100%{
opacity:1;
transform:translateY(0);
}
50%{
opacity:.5;
transform:translateY(-5px);
}
}

canvas{
position:absolute;
top:0;
left:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

<h1>❤️ I LOVE YOU ❤️</h1>

<div class="message" id="msg"></div>

<button onclick="celebrate()">
💖 Click Me 💖
</button>

</div>

<!-- Optional Music -->
<!-- Replace love.mp3 with your song -->
<audio id="music" loop>
<source src="love.mp3" type="audio/mpeg">
</audio>

<script>
// Love Messages

const messages=[
"You are the best thing that ever happened to me ❤️",
"Every heartbeat whispers your name 💖",
"I fall in love with you every single day 🌹",
"You make my world brighter ☀️",
"My heart belongs only to you 💞",
"Forever isn't long enough with you 💍",
"You are my dream come true ✨",
"I Love You More Than Words Can Say ❤️",
"You complete my life 💕",
"Together Forever 💑"
];

let index=0;

function changeMessage(){
document.getElementById("msg").innerHTML=messages[index];
index=(index+1)%messages.length;
}
changeMessage();
setInterval(changeMessage,3000);

// Floating Hearts

function createHeart(){

const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*35)+"px";
heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,250);

// -------------------
// Confetti Animation
// -------------------

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let confetti=[];

function Confetti(){

this.x=Math.random()*canvas.width;
this.y=Math.random()*canvas.height-canvas.height;
this.size=Math.random()*8+4;

this.speed=Math.random()*3+2;

this.angle=Math.random()*360;

this.color=`hsl(${Math.random()*360},100%,60%)`;

this.draw=function(){

ctx.save();

ctx.translate(this.x,this.y);

ctx.rotate(this.angle);

ctx.fillStyle=this.color;

ctx.fillRect(-this.size/2,-this.size/2,this.size,this.size);

ctx.restore();

};

this.update=function(){

this.y+=this.speed;
this.angle+=0.05;

if(this.y>canvas.height+20){

this.y=-20;
this.x=Math.random()*canvas.width;

}

};

}

for(let i=0;i<200;i++){
confetti.push(new Confetti());
}

let confettiRunning=false;

function animate(){

if(!confettiRunning)return;

ctx.clearRect(0,0,canvas.width,canvas.height);

confetti.forEach(c=>{
c.update();
c.draw();
});

requestAnimationFrame(animate);

}

function celebrate(){

const music=document.getElementById("music");
music.play().catch(()=>{});

confettiRunning=true;
animate();

setTimeout(()=>{
confettiRunning=false;
ctx.clearRect(0,0,canvas.width,canvas.height);
},7000);

}

window.onload=celebrate;
</script>

</body>
</html>
